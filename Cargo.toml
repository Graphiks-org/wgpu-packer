[workspace]
resolver = "2"
members = ["ffi"]

[workspace.dependencies.wgc]
package = "wgpu-core"
version = "=30.0.2"
# API tracing (WGPUDeviceExtras.tracePath): gates wgt::Trace::Directory.
# Costs ~2.6 MB of trace serialization in the static library; the path is a
# debugging aid, documented as such in the GUIDE.
features = ["trace"]

[workspace.dependencies.wgt]
package = "wgpu-types"
version = "=30.0.2"
# Internal counters (wgpuDeviceGetInternalCounters): without it every
# counter reads 0.
features = ["counters"]

[workspace.dependencies.hal]
package = "wgpu-hal"
version = "=30.0.2"

[workspace.dependencies.naga]
package = "naga"
version = "=30.0.2"

[profile.release]
panic = "unwind"
# rustc's own debuginfo stripping mis-aligns the LINKEDIT string pool of
# cdylibs (rust-lang/rust#157750): macOS 27's stricter dyld then rejects the
# library at dlopen with "mis-aligned LINKEDIT string pool". Keep debuginfo in
# the artifacts; scripts/package.sh strips the Apple-darwin shared library with
# /usr/bin/strip, which pads LINKEDIT correctly.
strip = "none"
